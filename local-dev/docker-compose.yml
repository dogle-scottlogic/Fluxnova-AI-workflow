# Local development stack: Fluxnova + OTel Collector, run with Podman (or Docker).
#
# Usage (from this directory):
#   podman compose up -d          # or: docker compose up -d
#   podman compose down
#
# The Fluxnova image is *not* published anywhere — set FLUXNOVA_IMAGE (see .env.example)
# to point at whatever image you build/pull locally before starting the stack.
#
# default.yml here enables the OpenTelemetry process engine plugin. As of the
# fluxnova-bpm-platform build that bundles the OTel plugin's jars into userlib by default,
# no extra volume mount is needed for this to work.
#
# The MLflow tracking server is expected to keep running on the *host* (see the main
# README's "Running the MLflow tracking server" section) — it is not containerised here.
# The OTel Collector exports traces to it via `host.containers.internal`, which Podman
# (and Docker Desktop) resolve to the host machine from inside a container.

services:
  fluxnova:
    image: ${FLUXNOVA_IMAGE:-fluxnova:local}
    container_name: fluxnova
    ports:
      - "${FLUXNOVA_PORT:-8080}:8080"
    environment:
      # Point the agent's OTel instrumentation at the collector service below.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - ./default.yml:/fluxnova/configuration/default.yml:ro
    depends_on:
      - otel-collector
    networks:
      - fluxnova-local

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-docker.io/otel/opentelemetry-collector-contrib:latest}
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    extra_hosts:
      # Lets the collector reach the MLflow tracking server running on the host.
      - "host.containers.internal:host-gateway"
    networks:
      - fluxnova-local

networks:
  fluxnova-local:
    driver: bridge
