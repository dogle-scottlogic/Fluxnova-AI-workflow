# Config used by the eval-service-worker container (see eval-service-up.sh) — mirrors
# harness/config/loan-assesment.yml, but with the fluxnova_url/tracking_uri pointing at
# the *pod names* of the sibling fluxnova-local/mlflow-local pods on the shared
# fluxnova-dev network, rather than localhost (which only works for host-run tools).
fluxnova_url: http://fluxnova-local:8080/engine-rest
process_key: loanAssessmentProcess

eval_service:
  topic: agent-output-eval
  judge_model: gateway:/fluxnova-judge
  lock_duration_ms: 180000

mlflow_dataset:
  tracking_uri: http://mlflow-local:5000
  # experiment_name: fluxnova-loanAssessmentProcess-demo   # uncomment to override
