# OTel Collector config for local development.
#
# Receives OTLP traces from the Fluxnova container (and, if you point your local
# agent instrumentation at this collector too, from the host) and forwards them
# straight to the MLflow tracking server's native OTLP endpoint, per the main
# README's architecture (OTel Collector -> MLflow /v1/traces -> mlflow-eval --collect).
#
# `host.containers.internal` resolves to the host machine from inside the container
# (wired up via `extra_hosts` in docker-compose.yml, or `--add-host` in pod-up.sh) —
# that's where the MLflow tracking server should be listening, whether that's a host-run
# `mlflow server ...` process (see the main README) or the mlflow-local pod
# (mlflow-pod-up.sh), whose port is published to the host either way.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # otlp_http automatically appends /v1/traces to this base endpoint.
  otlp_http:
    endpoint: http://host.containers.internal:5000
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http, debug]
